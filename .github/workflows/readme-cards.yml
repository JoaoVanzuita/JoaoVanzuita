name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to v2.1.0 (v2 tag) via commit SHA for supply-chain safety.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=JoaoVanzuita&show_icons=true&count_private=true&theme=midnight-purple
          path: profile/stats.svg
          # Falls back to the workflow token when STATS_PAT is not configured.
          token: ${{ secrets.STATS_PAT || github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=JoaoVanzuita&layout=compact&langs_count=7&theme=midnight-purple
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || github.token }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update README cards"
            git push
          fi
